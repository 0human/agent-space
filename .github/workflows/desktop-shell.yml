name: Desktop Shell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.os }} build and startup smoke
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Linux display server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Startup smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:smoke

      - name: Startup smoke
        if: runner.os != 'Linux'
        run: pnpm test:smoke
