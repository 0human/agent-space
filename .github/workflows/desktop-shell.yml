name: Desktop Shell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.os }} build and startup smoke
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package installable application
        run: pnpm package

      - name: Upload installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-space-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Install Linux display server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Packaged startup smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:smoke:packaged

      - name: Packaged startup smoke
        if: runner.os != 'Linux'
        run: pnpm test:smoke:packaged

      - name: Startup smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:smoke

      - name: Startup smoke
        if: runner.os != 'Linux'
        run: pnpm test:smoke
